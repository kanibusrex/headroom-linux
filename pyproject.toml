[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "headroom"
version = "0.1.0"
description = "A Linux disk-space utility for Arch/Omarchy: clear caches, find large files, and uninstall packages cleanly."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["textual>=0.80"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
headroom = "headroom.cli:main"

[tool.setuptools]
packages = ["headroom"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
